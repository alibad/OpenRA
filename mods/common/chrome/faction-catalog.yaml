Background@FACTION_CATALOG_PANEL:
	Logic: FactionCatalogLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 1440 + ((WINDOW_WIDTH - 80) < 1440) * (WINDOW_WIDTH - 1520)
	Height: 900 + ((WINDOW_HEIGHT - 40) < 900) * (WINDOW_HEIGHT - 940)
	Children:
		LogicKeyListener@CATALOG_KEYS:
		Label@TITLE:
			Y: 14
			Width: PARENT_WIDTH
			Height: 28
			Text: label-faction-catalog-title
			Align: Center
			Font: Bold
		Label@SUBTITLE:
			X: 20
			Y: 40
			Width: PARENT_WIDTH - 40
			Height: 18
			Align: Center
			Font: Tiny
		Background@FACTIONS_HEADER:
			X: 20
			Y: 66
			Width: 250
			Height: 13
			Background: separator
			ClickThrough: true
			Children:
				Label@LABEL:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Text: label-faction-catalog-factions
					Align: Center
					Font: TinyBold
		ScrollPanel@FACTION_LIST:
			X: 20
			Y: 84
			Width: 250
			Height: PARENT_HEIGHT - 170
			TopBottomSpacing: 4
			ItemSpacing: 2
			Children:
				ScrollItem@HEADER_TEMPLATE:
					X: 4
					Width: PARENT_WIDTH - 29
					Height: 20
					Background: scrollheader
					Visible: false
					Children:
						Label@LABEL:
							X: 8
							Width: PARENT_WIDTH - 16
							Height: PARENT_HEIGHT
							Font: TinyBold
				ScrollItem@FACTION_TEMPLATE:
					X: 4
					Width: PARENT_WIDTH - 29
					Height: 42
					Visible: false
					EnableChildMouseOver: true
					Children:
						ColorBlock@ACCENT:
							X: 4
							Y: 6
							Width: 4
							Height: 30
						LabelWithTooltip@NAME:
							X: 14
							Y: 3
							Width: PARENT_WIDTH - 20
							Height: 20
							Font: Bold
							TooltipContainer: FACTION_CATALOG_TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
						Label@DETAIL:
							X: 14
							Y: 21
							Width: PARENT_WIDTH - 20
							Height: 16
							Font: Tiny
		LabelWithTooltip@OTHER_MODE_NOTE:
			X: 22
			Y: PARENT_HEIGHT - 82
			Width: 246
			Height: 34
			Font: Tiny
			TooltipContainer: FACTION_CATALOG_TOOLTIP_CONTAINER
			TooltipTemplate: SIMPLE_TOOLTIP
		Background@FACTION_HEADER:
			X: 285
			Y: 66
			Width: (PARENT_WIDTH - 305)
			Height: 158
			Background: dialog3
			Children:
				ColorBlock@ACCENT_BAR:
					X: 2
					Y: 2
					Width: 6
					Height: PARENT_HEIGHT - 4
				LabelWithTooltip@FACTION_NAME:
					X: 18
					Y: 8
					Width: PARENT_WIDTH - 285
					Height: 24
					Font: Bold
					TooltipContainer: FACTION_CATALOG_TOOLTIP_CONTAINER
					TooltipTemplate: SIMPLE_TOOLTIP
				LabelWithTooltip@FACTION_TAGLINE:
					X: 18
					Y: 31
					Width: PARENT_WIDTH - 285
					Height: 18
					Font: TinyBold
					TooltipContainer: FACTION_CATALOG_TOOLTIP_CONTAINER
					TooltipTemplate: SIMPLE_TOOLTIP
				LabelWithTooltip@FACTION_FACTS:
