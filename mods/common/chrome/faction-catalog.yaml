					Children:
						Label@SIGNATURE_LABEL:
							Y: 4
							Width: PARENT_WIDTH
							Height: 16
							Text: label-faction-catalog-signature
							Align: Center
							Font: TinyBold
						Sprite@SIGNATURE_ICON:
							X: (PARENT_WIDTH - WIDTH) / 2
							Y: 22
							Width: 64
							Height: 48
						Label@SIGNATURE_NAME:
							X: 6
							Y: 72
							Width: PARENT_WIDTH - 12
							Height: 18
							Align: Center
							Font: Bold
						Label@SIGNATURE_ROLE:
							X: 6
							Y: 90
							Width: PARENT_WIDTH - 12
							Height: 16
							Align: Center
							Font: Tiny
						Button@SIGNATURE_BUTTON:
							X: 30
							Y: 111
							Width: PARENT_WIDTH - 60
							Height: 24
							Text: button-faction-catalog-view-signature
							Font: TinyBold
