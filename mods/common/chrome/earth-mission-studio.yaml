Background@EARTH_MISSION_PANEL:
	Logic: EarthMissionStudioLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	# WINDOW_* is reported in physical pixels while widget coordinates use the
	# UI-scaled resolution. The 2/3 conversion keeps this full-screen workbench
	# inside the usable area at 150% Windows display scaling.
	Width: WINDOW_WIDTH * 2 / 3 - 40
	Height: WINDOW_HEIGHT * 2 / 3 - 30
	Children:
		Label@TITLE_LABEL:
			Y: 10
			Width: PARENT_WIDTH
			Height: 22
			Text: label-earth-workbench-title
			Align: Center
			Font: Bold
		Label@SUBTITLE_LABEL:
			Y: 30
			Width: PARENT_WIDTH
			Height: 16
			Text: label-earth-workbench-subtitle
			Align: Center
			Font: Tiny
		Background@WORKFLOW_ROW:
			X: 20
			Y: 49
			Width: PARENT_WIDTH - 40
			Height: 24
			Background: dialog4
			Children:
				Label@WORKFLOW_1:
					Width: PARENT_WIDTH / 4
					Height: 24
					Align: Center
					Font: TinyBold
				Label@WORKFLOW_2:
					X: PARENT_WIDTH / 4
					Width: PARENT_WIDTH / 4
					Height: 24
					Align: Center
					Font: TinyBold
				Label@WORKFLOW_3:
					X: PARENT_WIDTH / 2
					Width: PARENT_WIDTH / 4
					Height: 24
					Align: Center
					Font: TinyBold
				Label@WORKFLOW_4:
					X: PARENT_WIDTH * 3 / 4
					Width: PARENT_WIDTH / 4
					Height: 24
					Align: Center
					Font: TinyBold
		Container@SEARCH_ROW:
			X: 20
			Y: 78
			Width: PARENT_WIDTH - 40
			Height: 28
			Children:
				TextField@LOCATION:
					Width: PARENT_WIDTH - 350
					Height: 28
					MaxLength: 160
				Button@SEARCH:
					X: PARENT_WIDTH - 340
					Width: 105
					Height: 28
					Text: button-earth-search
					Font: Bold
				Label@COORDINATE_STATUS:
					X: PARENT_WIDTH - 225
					Width: 225
					Height: 28
					Align: Right
					Font: TinyBold
		Background@EARTH_VIEW_CARD:
