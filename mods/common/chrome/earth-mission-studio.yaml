				Label@EARTH_ATTRIBUTION:
					X: 8
					Y: PARENT_HEIGHT - 21
					Width: PARENT_WIDTH - 16
					Height: 16
					Text: label-earth-map-attribution
					Align: Right
					Font: Tiny
					Contrast: true
		Background@GAME_VIEW_CARD:
