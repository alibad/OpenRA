Container@MISSION_OBJECTIVES:
	Height: PARENT_HEIGHT
	Width: PARENT_WIDTH
	Logic: GameInfoObjectivesLogic
	Children:
		Label@MISSION:
			X: 20
			Y: 21
			Width: 80
			Height: 25
			Font: MediumBold
			Text: label-mission-objectives
		Label@MISSION_STATUS:
			X: 100
			Y: 21
			Width: PARENT_WIDTH - 120
			Height: 25
			Font: MediumBold
		ScrollPanel@OBJECTIVES_PANEL:
			X: 20
			Y: 60
			Width: PARENT_WIDTH - 40
			Height: 325
			TopBottomSpacing: 15
			ItemSpacing: 15
			Children:
				Container@OBJECTIVE_TEMPLATE:
					Width: PARENT_WIDTH
					Height: 20
					Children:
						Label@OBJECTIVE_TYPE:
							X: 10
							Y: 1
							Width: 70
							Height: 20
							Align: Center
							VAlign: Top
						Checkbox@OBJECTIVE_STATUS:
							X: 90
							Y: 0
							Width: 20
							Height: 20
							Disabled: True
							TextColorDisabled: FFFFFF
						Label@OBJECTIVE_DESCRIPTION:
							X: 120
							Y: 1
							Width: PARENT_WIDTH - 130
							Height: 20
							Font: Regular
							VAlign: Top
							WordWrap: True
