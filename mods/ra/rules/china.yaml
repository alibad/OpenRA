^ChinaNetworked:
	ExternalCondition@COMMANDNETWORK:
		Condition: china-command-network
	FirepowerMultiplier@COMMANDNETWORK:
		Modifier: 112
		RequiresCondition: china-command-network
	ReloadDelayMultiplier@COMMANDNETWORK:
		Modifier: 90
		RequiresCondition: china-command-network

CNRIFLE:
