		Name: china-amphibious
		Crushes: wall, mine, crate, infantry
		TerrainSpeeds:
			Clear: 90
			Rough: 78
			Road: 108
			Bridge: 108
			Ore: 78
			Gems: 78
			Beach: 92
			Water: 70

World:
