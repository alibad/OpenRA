F15SA:
	Inherits: ^Plane
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Voiced:
		VoiceSet: SaudiAirVoice
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Helicopter
		BuildPaletteOrder: 45
		Prerequisites: ~hpad, atek, ~aircraft.saudi, ~techlevel.high
		Description: actor-f15sa.description
	Valued:
		Cost: 2200
	Tooltip:
		Name: actor-f15sa.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 9000
	RevealsShroud:
		MinRange: 10c0
		Range: 12c0
		Type: GroundPosition
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 10c0
		Type: GroundPosition
	Armament@AAM:
		Name: aam
		Weapon: RedSeaF15AAM
		LocalOffset: 0,-640,-64, 0,640,-64
		LocalYaw: -32, 32
		PauseOnCondition: !aam-ammo
	Armament@CANNON:
		Name: cannon
		Weapon: RedSeaF15Cannon
		LocalOffset: 384,128,-64
		MuzzleSequence: air-muzzle
		PauseOnCondition: !gun-ammo
	AttackAircraft:
		Armaments: aam, cannon
		FacingTolerance: 72
		PersistentTargeting: false
		OpportunityFire: True
	Aircraft:
		CruiseAltitude: 2560
		TurnSpeed: 18
		Speed: 240
		RepulsionSpeed: 42
		MaximumPitch: 56
	AutoTarget:
		InitialStance: HoldFire
		InitialStanceAI: AttackAnything
	AmmoPool@AAM:
		Name: aam
		Armaments: aam
		Ammo: 4
		ReloadDelay: 28
		AmmoCondition: aam-ammo
	AmmoPool@GUN:
		Name: gun
		Armaments: cannon
		Ammo: 12
		ReloadDelay: 5
		AmmoCondition: gun-ammo
	WithMuzzleOverlay:
	Contrail@LEFT:
		Offset: -640,-420,0
		StartColorAlpha: 128
	Contrail@RIGHT:
		Offset: -640,420,0
		StartColorAlpha: 128
	SpawnActorOnDeath:
		Actor: F15SA.Husk
	LeavesTrails:
		Offsets: -768,0,128
		MovingInterval: 2
		Image: smokey
		SpawnAtLastPosition: False
		Type: CenterPosition
		RequiresCondition: enable-smoke
	Selectable:
		Bounds: 1536, 1194
		DecorationBounds: 1706, 1280
	Rearmable:
		RearmActors: hpad
		AmmoPools: aam, gun
	WithAmmoPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true
		PipCount: 8
	GrantConditionOnDamageState@SmokeTrail:
		Condition: enable-smoke
	RenderSprites:
		Image: f15sa

