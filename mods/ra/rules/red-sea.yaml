Player:
	# Easy can express each faction's ground identity using the tech buildings it
	# already knows how to construct. Medium and Rush receive air production so
	# Yemen's Samad weight is reachable instead of dead configuration.
	BaseBuilderBotModule@medium:
		TechTypes: dome, atek, stek, fix, afld, hpad
		ProductionTypes: barr,tent,weap,afld,hpad
		BuildingLimits:
			hpad: 2
			afld: 2
		BuildingFractions:
			hpad: 1
			afld: 1
	BaseBuilderBotModule@rush:
		TechTypes: mslo, dome, atek, stek, fix, afld, hpad
		ProductionTypes: barr,tent,weap,afld,hpad
		BuildingLimits:
			hpad: 3
			afld: 3
		BuildingFractions:
			hpad: 1
			afld: 1
