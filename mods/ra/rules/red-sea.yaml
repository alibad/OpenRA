# Red Sea vertical-slice prototype actors.
#
# These deliberately reuse proven Red Alert render sequences while the original
# sprite sheets are produced. Their mechanics, costs, faction gating, AI usage,
# and localized identity are live gameplay rather than design-only metadata.

World:
	StartingUnits@mcvonly:
		Factions: allies, england, france, germany, saudi, soviet, russia, ukraine, yemen
	StartingUnits@lightallies:
		Factions: allies, england, france, germany, saudi
	StartingUnits@lightsoviet:
		Factions: soviet, russia, ukraine, yemen
	StartingUnits@heavyallies:
		Factions: allies, england, france, germany, saudi
	StartingUnits@heavysoviet:
		Factions: soviet, russia, ukraine, yemen

