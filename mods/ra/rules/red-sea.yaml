SAMAD:
	Inherits: YAK
	Voiced:
		VoiceSet: YemenVehicleVoice
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Plane
		BuildPaletteOrder: 25
		Prerequisites: ~afld, ~aircraft.yemen, ~techlevel.medium
		Description: actor-samad.description
	Valued:
		Cost: 650
	Tooltip:
		Name: actor-samad.name
	Health:
		HP: 3600
	Armament:
		Weapon: RedSeaDroneStrike
		LocalOffset: 128,0,-64
		PauseOnCondition: !ammo
	AmmoPool:
		Ammo: 1
		AmmoCondition: ammo
	AttackAircraft:
		FacingTolerance: 512
		PersistentTargeting: true
		AttackType: Hover
		OpportunityFire: False
	GrantConditionOnAttack@PAYLOAD:
		Condition: payload-released
		ArmamentNames: primary
		RevokeDelay: 5
	KillsSelf@PAYLOAD:
		RequiresCondition: payload-released
	Aircraft:
		CruiseAltitude: 1152
		TurnSpeed: 10
		Speed: 116
		RepulsionSpeed: 20
		MaximumPitch: 56
		MoveIntoShroud: true
	RevealsShroud:
		MinRange: 4c0
		Range: 7c0
		Type: GroundPosition
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
		Type: GroundPosition
	AutoTarget:
		InitialStance: HoldFire
		InitialStanceAI: AttackAnything
	AmbientSound@PROPELLER:
		SoundFiles: redsea-drone-loiter.wav
	-Contrail:
	-LeavesTrails:
	-GrantConditionOnDamageState@SmokeTrail:
	-SpawnActorOnDeath:
	-EjectOnDeath:
	-Rearmable:
	-WithAmmoPipsDecoration:
	-WithMuzzleOverlay:
	RenderSprites:
		Image: samad

