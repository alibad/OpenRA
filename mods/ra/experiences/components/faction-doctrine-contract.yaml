Player:
	ProvidesFactionDoctrine@ALLIED:
		Factions: allies, england, france, germany
		Prerequisites: side.allies, doctrine.combined-arms
	ProvidesFactionDoctrine@SAUDI:
		Factions: saudi
		Prerequisites: side.allies, country.saudi, doctrine.expeditionary
	ProvidesFactionDoctrine@TURKEY:
		Factions: turkey
		Prerequisites: side.allies, country.turkey, doctrine.mobile-defense
	ProvidesFactionDoctrine@CHINA:
		Factions: china
		Prerequisites: side.allies, country.china, doctrine.networked-combined-arms
	ProvidesFactionDoctrine@SOVIET:
		Factions: soviet, russia, ukraine
		Prerequisites: side.soviet, doctrine.armored-assault
	ProvidesFactionDoctrine@YEMEN:
		Factions: yemen
		Prerequisites: side.soviet, country.yemen, doctrine.asymmetric-defense
	ProvidesFactionDoctrine@IRAN:
		Factions: iran
		Prerequisites: side.soviet, country.iran, doctrine.layered-denial

^RoleRifleInfantry:
	StrategicRole:
		Roles: rifle, line-infantry
		Counters: infantry
		Domain: infantry
		TransportWeight: 1

^RoleAntiArmorInfantry:
	StrategicRole:
		Roles: anti-armor, line-infantry
		Counters: armor, building
		Domain: infantry
		TransportWeight: 1

^RoleEngineer:
	StrategicRole:
		Roles: engineer, capture, repair
		Domain: infantry
		AIWeight: 65
		TransportWeight: 1

^RoleScoutVehicle:
	StrategicRole:
		Roles: scout, reconnaissance, light-vehicle
		Counters: infantry
		Domain: ground
		AIWeight: 75
		TransportWeight: 2

^RoleMainBattleTank:
	StrategicRole:
		Roles: main-battle-tank, armor, frontline
		Counters: armor, building
		Domain: ground
		AIWeight: 140
		TransportWeight: 4
		VeterancyCurve: armored

^RoleArtillery:
	StrategicRole:
		Roles: artillery, indirect-fire, siege
		Counters: building, defense, infantry
		Domain: ground
		AIWeight: 115
		TransportWeight: 4

^RoleAntiAirVehicle:
	StrategicRole:
		Roles: anti-air, escort, light-vehicle
		Counters: aircraft, drone
		Domain: ground
		AIWeight: 105
		TransportWeight: 3

^RoleTransport:
	StrategicRole:
		Roles: transport, evacuation, logistics
		Domain: logistics
		AIWeight: 70
		TransportWeight: 4

^RoleInterceptor:
	StrategicRole:
		Roles: interceptor, air-superiority
		Counters: aircraft, drone
		Domain: air
		AIWeight: 120
		TransportWeight: 0

^RoleAttackAircraft:
	StrategicRole:
		Roles: strike-aircraft, close-air-support
		Counters: armor, building
		Domain: air
		AIWeight: 125
		TransportWeight: 0

^RolePatrolCraft:
	StrategicRole:
		Roles: patrol-craft, naval-screen
		Counters: submarine, light-ship
		Domain: naval
		AIWeight: 80
		TransportWeight: 0

^RoleDestroyer:
	StrategicRole:
		Roles: destroyer, fleet-escort, anti-submarine
		Counters: submarine, aircraft, light-ship
		Domain: naval
		AIWeight: 130
		TransportWeight: 0

^RoleSubmarine:
	StrategicRole:
		Roles: submarine, naval-ambush
		Counters: capital-ship, transport
		Domain: naval
		AIWeight: 120
		TransportWeight: 0

