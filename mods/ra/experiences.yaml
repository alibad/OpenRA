ExperienceCatalog:
	Mod: ra
	DefaultProfile: world-war-iii
	Components:
		minefield-generator:
			Title: Replenishing minefields
			Description: Structures and mission proxies can maintain configurable defensive mine perimeters.
			Category: Defenses
			Version: 1
			Source: Combined Arms and Generals Alpha adaptations
			License: GPL-3.0-or-later
			Rules: ra|experiences/components/minefield-generator.yaml
			Parameters:
				recreation-interval:
					Title: Replenishment interval
					Description: Ticks between attempts to rebuild destroyed defensive mines.
					Group: Balance
					Type: Integer
					Default: 2500
					Minimum: 250
					Maximum: 5000
					Step: 250
					Unit: ticks
				slot-count:
					Title: Active mine slots
					Description: Maximum mine positions maintained by each generator.
					Group: Units
					Type: Integer
					Default: 4
					Minimum: 1
					Maximum: 4
					Step: 1
					Unit: mines
		mission-aware-minelayer-ai:
			Title: Mission-aware minelayer AI
			Description: Bots seed authored mine zones, scan quickly, filter rosters, and recover stuck minelayers.
			Category: AI strategies
			Version: 1
			Source: Shattered Paradise pattern adapted into native OpenRA AI
			License: GPL-3.0-or-later
			Dependencies: minefield-generator
			Parameters:
				scan-interval:
					Title: AI scan interval
					Description: Ticks between minelayer assignment scans after the opening phase.
					Group: AI
					Type: Integer
					Default: 320
					Minimum: 80
					Maximum: 640
					Step: 40
					Unit: ticks
				minefield-radius:
					Title: AI minefield radius
					Description: Radius used for automated mine-laying orders.
					Group: AI
					Type: Integer
					Default: 1
					Minimum: 1
					Maximum: 4
					Step: 1
					Unit: cells
				stuck-recovery:
					Title: Recover stuck minelayers
					Description: Stops and reassigns AI minelayers that fail to move between scans.
					Group: AI
					Type: Boolean
					Default: true
		point-defense-interception:
			Title: Point-defense interception
			Description: Opt-in anti-missile weapons create layered protection for bases, fleets, and aircraft groups.
			Category: Defenses
			Version: 1
			Source: Combined Arms and RA Plus adaptations
			License: GPL-3.0-or-later
			Rules: ra|experiences/components/point-defense-interception.yaml
			Weapons: ra|experiences/weapons/point-defense-interception.yaml
			Parameters:
				range-percent:
					Title: Interception range
					Description: Percentage of the point-defense weapon range that can intercept missiles.
					Group: Weapons
					Type: Integer
					Default: 100
					Minimum: 25
					Maximum: 150
					Step: 5
					Unit: percent
				intercept-effects:
					Title: Interception effects
					Description: Fires the configured visual and audio interception effect when a missile is stopped.
					Group: Effects
					Type: Boolean
					Default: true
		battlefield-salvage:
			Title: Battlefield salvage
			Description: Destroyed vehicles can leave recoverable value for scavenger forces and mission objectives.
			Category: Economy and missions
			Version: 1
			Source: OpenHV and Combined Arms adaptations
			License: GPL-3.0-or-later
			Rules: ra|experiences/components/battlefield-salvage.yaml
			Parameters:
				spawn-probability:
					Title: Salvage frequency
					Description: Percentage chance that an eligible destroyed unit leaves salvage.
					Group: Units
					Type: Integer
					Default: 50
					Minimum: 0
					Maximum: 100
					Step: 5
					Unit: percent
				value-percentage:
					Title: Salvage value
					Description: Percentage of the destroyed unit sell value awarded to the collector.
					Group: Economy
					Type: Integer
					Default: 15
					Minimum: 5
					Maximum: 50
					Step: 5
					Unit: percent
				eligible-faction:
					Title: Eligible faction
					Description: Restricts salvage drops to one faction, or allows every faction.
					Group: Factions
					Type: Choice
					Default: All
					Options: All, allies, england, france, germany, saudi, turkey, china, soviet, russia, ukraine, yemen, iran
	Profiles:
		world-war-iii:
			Title: World War III
			Description: The curated default with all currently integrated gameplay modules enabled.
			Components: minefield-generator, mission-aware-minelayer-ai, point-defense-interception, battlefield-salvage
		core-operations:
			Title: Core Operations
			Description: The core game without optional reusable capability modules.
			Components:
		layered-defense:
			Title: Layered Defense
			Description: Mine warfare, defensive AI, and missile interception without battlefield salvage.
			Components: minefield-generator, mission-aware-minelayer-ai, point-defense-interception
